# Install once: pip install pre-commit && pre-commit install
# Run on everything: pre-commit run --all-files
#
# The whitespace fixers skip hash-pinned templates and frozen evidence under
# output/: rewriting them would break their recorded SHA-256 values. The
# secret and size checks still cover every file.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: &frozen ^(src/invoice_optimizer/templates/|output/(pdf|source)/)
      - id: end-of-file-fixer
        exclude: *frozen
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
